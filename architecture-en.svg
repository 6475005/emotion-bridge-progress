<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc"><title id="title">Two-model cascade through generated reply audio</title><desc id="desc">Qwen completes audio, then audio features condition body generation. Synchronized playback follows both generation stages.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4c6559" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK JP",Meiryo,sans-serif;fill:#213c34}.label{font-size:19px;font-weight:700}.small{font-size:15px}.heading{font-size:24px;font-weight:700}.tiny{font-size:13px}</style><rect width="1120" height="890" fill="#f8f8f2"/><text x="25" y="38" class="heading">Model architecture: frozen Qwen + separate body generator</text><text x="25" y="70" class="small">Functional boundaries in one resident worker. Green: body-training target. Blue: frozen at that stage.</text><rect x="25" y="110" width="260" height="125" rx="8" fill="#efefe5" stroke="#779180"/><text x="41" y="139" class="label">Input</text><text x="41" y="166" class="small">text + history + language</text><text x="41" y="189" class="small">Verified input: text</text><text x="41" y="212" class="small">Image/audio body tests remain</text><rect x="340" y="110" width="320" height="125" rx="8" fill="#e7eef1" stroke="#779180"/><text x="356" y="139" class="label">Model1: Qwen3-Omni</text><text x="356" y="166" class="small">Thinker / Talker / audio output</text><text x="356" y="189" class="small">Reply text +24 kHz PCM16 WAV</text><text x="356" y="212" class="small">Qwen weights unchanged</text><rect x="720" y="110" width="370" height="125" rx="8" fill="#e7eef1" stroke="#779180"/><text x="736" y="139" class="label">Reuse Qwen audio_tower</text><text x="736" y="166" class="small">Completed WAV →16 kHz →4 s</text><text x="736" y="189" class="small">Right-pad tail; retain valid length</text><text x="736" y="212" class="small">[N, 52, 2048] → float32</text><polyline points="285,168 340,168" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,168 720,168" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="669" y="153" class="tiny">WAV</text><rect x="25" y="285" width="1065" height="320" rx="10" fill="#f0f5e9" stroke="#72905c" stroke-width="2"/><text x="45" y="318" class="label">Model2: shared conditioned body diffusion (full-v5)</text><rect x="45" y="345" width="270" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="61" y="374" class="label">Conditions + state</text><text x="61" y="401" class="small">audio: [N,52,2048]</text><text x="61" y="424" class="small">history: previous30 frames</text><text x="61" y="447" class="small">latent noise + timestep</text><rect x="355" y="345" width="365" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="371" y="374" class="label">Shared Transformer lineage</text><text x="371" y="401" class="small">width256 /12 blocks /8 heads</text><text x="371" y="424" class="small">Self-attention + audio cross-attn</text><text x="371" y="447" class="small">Rig-specific input/output projections</text><rect x="760" y="345" width="305" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="776" y="374" class="label">Predict latent velocity v</text><text x="776" y="401" class="small">dynamics: [1,150,32]</text><text x="776" y="424" class="small">Trinity pose only: [1,150]</text><text x="776" y="447" class="small">Iterate over50 fixed steps</text><polyline points="904,235 904,260 35,260 35,332 180,332 180,345" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="253" class="tiny">Normalize with retained fitting statistics</text><polyline points="315,415 355,415" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,415 760,415" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="525" class="small">150 slots =30 context +120 current; absent context slots are masked.</text><text x="45" y="555" class="small">14,055,926 body-training parameters; excludes Qwen. No inference-time updates.</text><rect x="45" y="650" width="430" height="126" rx="8" fill="#e7eef1" stroke="#779180"/><text x="61" y="679" class="label">Frozen motion codec / decoding</text><text x="61" y="706" class="small">Japanese:120 frames ×120D</text><text x="61" y="729" class="small">Trinity English:120 frames ×150D</text><text x="61" y="752" class="small">6D joint rotations; concatenate valid frames.</text><rect x="640" y="650" width="425" height="126" rx="8" fill="#eee9da" stroke="#779180"/><text x="656" y="679" class="label">Schematic map → audio-clock playback</text><text x="656" y="706" class="small">8 schematic coordinates ≠ servo commands</text><text x="656" y="729" class="small">frame = floor(audio.currentTime ×30)</text><text x="656" y="752" class="small">Physical SDK/joint conversion not connected</text><polyline points="908,487 908,580 270,580 270,650" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="573" class="tiny">Decode latent</text><polyline points="475,711 640,711" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="697" class="tiny">Original audio</text><polyline points="100,650 100,625 10,625 10,505 65,505 65,487" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="628" class="tiny">Generated30-frame suffix → next window</text><text x="25" y="827" class="small">Body input is reply-audio features, not direct Qwen Talker hidden states or reply-text tokens.</text><text x="25" y="858" class="small">Co-residency is distinct from jointly training the two models.</text></svg>