<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-labelledby="t d"><title id="t">Frozen Qwen3-Omni chained to the learned body-motion model</title><desc id="d">Qwen produces reply text and speech; the reused Qwen audio encoder turns that speech into features; the learned body diffusion model generates 30 Hz joint rotations, decoded by frozen codecs and played in sync with the audio in a schematic browser view. The physical robot is not connected.</desc><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4a5a63"/></marker></defs><style>text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,Arial,sans-serif;fill:#1a2228}.h{font-size:19px;font-weight:700}.b{font-size:14.5px}.s{font-size:13px;fill:#3f4c55}.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em}.cap{font-size:13px;fill:#6b7982}.mono{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:13px}</style><rect width="1120" height="900" fill="#f8f9f9"/><rect x="30" y="30" width="250" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="46" y="58" class="h" text-anchor="start">Input</text><text x="46" y="86" class="b" text-anchor="start">text + dialogue history + language</text><text x="46" y="108" class="b" text-anchor="start">validated: text input</text><text x="46" y="130" class="b" text-anchor="start">mic/camera input: next stage</text><rect x="320" y="30" width="380" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="336" y="58" class="h" text-anchor="start">Model 1: Qwen3-Omni</text><rect x="616" y="40" width="72" height="22" rx="11" fill="#f8f9f9" stroke="#7d95a6"/><text x="652.0" y="55" class="tag" text-anchor="middle" fill="#7d95a6" style="fill:#7d95a6">frozen</text><text x="336" y="86" class="b" text-anchor="start">Thinker / Talker / speech codec</text><text x="336" y="108" class="b" text-anchor="start">output: reply text + 24 kHz speech (WAV)</text><text x="336" y="130" class="b" text-anchor="start">weights are not updated</text><rect x="740" y="30" width="350" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="756" y="58" class="h" text-anchor="start">Reused Qwen audio encoder</text><text x="756" y="86" class="mono" text-anchor="start">completed speech → 16 kHz → 4-s windows</text><text x="756" y="108" class="mono" text-anchor="start">[N, 52, 2048] float32</text><text x="756" y="130" class="b" text-anchor="start">no second encoder on the GPU</text><polyline points="280,95 318,95" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><polyline points="700,95 738,95" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="703" y="80" class="s" text-anchor="start">reply speech</text><rect x="30" y="215" width="1060" height="330" rx="10" fill="none" stroke="#5e8c6b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="50" y="245" class="h" text-anchor="start">Model 2: audio-conditioned body diffusion model (internal name full-v5, 16,000 updates)</text><text x="50" y="268" class="s" text-anchor="start">14,055,926 trainable body parameters (Qwen excluded). Nothing is updated at inference.</text><rect x="50" y="290" width="320" height="230" rx="8" fill="#dcecdf" stroke="#5e8c6b" stroke-width="1.5"/><text x="66" y="318" class="h" text-anchor="start">Conditions and state</text><text x="66" y="346" class="b" text-anchor="start">audio features [N,52,2048] → 32 → 256</text><text x="66" y="368" class="b" text-anchor="start">previous 30 generated frames (history)</text><text x="66" y="390" class="b" text-anchor="start">latent noise + diffusion step</text><text x="66" y="412" class="b" text-anchor="start">tokens 180 = history 30 + context 30 + current 120</text><text x="66" y="434" class="b" text-anchor="start">normalized with saved training statistics</text><rect x="400" y="290" width="320" height="230" rx="8" fill="#dcecdf" stroke="#5e8c6b" stroke-width="1.5"/><text x="416" y="318" class="h" text-anchor="start">Shared Transformer</text><rect x="627" y="300" width="81" height="22" rx="11" fill="#f8f9f9" stroke="#5e8c6b"/><text x="667.5" y="315" class="tag" text-anchor="middle" fill="#5e8c6b" style="fill:#5e8c6b">learned</text><text x="416" y="346" class="b" text-anchor="start">width 256 / 12 blocks / 8 heads</text><text x="416" y="368" class="b" text-anchor="start">self-attention + cross-attention to audio</text><text x="416" y="390" class="b" text-anchor="start">per-language (per-rig) input/output layers</text><text x="416" y="412" class="b" text-anchor="start">predicts latent velocity v</text><text x="416" y="434" class="b" text-anchor="start">deterministic sampling, 50 steps</text><rect x="750" y="290" width="320" height="230" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="766" y="318" class="h" text-anchor="start">Frozen motion codecs (decode)</text><text x="766" y="346" class="b" text-anchor="start">Japanese: 120 frames × 120 dims</text><text x="766" y="368" class="b" text-anchor="start">English (Trinity): 120 × 150 dims</text><text x="766" y="390" class="b" text-anchor="start">20 / 25 joints × 6D rotation</text><text x="766" y="412" class="b" text-anchor="start">valid frames only are concatenated</text><text x="766" y="434" class="b" text-anchor="start">30 Hz joint-rotation sequence</text><polyline points="370,405 398,405" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><polyline points="720,405 748,405" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="734" y="388" class="s" text-anchor="middle">decode</text><polyline points="915,160 915,213" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="925" y="195" class="s" text-anchor="start">features</text><polyline points="1030,520 1030,560 210,560 210,522" fill="none" stroke="#4a5a63" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="500" y="548" class="s" text-anchor="middle">last 30 generated frames become the history of the next 4-s window (reset between replies)</text><rect x="30" y="640" width="500" height="150" rx="8" fill="#f1e8d6" stroke="#b08a4a" stroke-width="1.5"/><text x="46" y="668" class="h" text-anchor="start">Schematic mapping (8 coordinates)</text><rect x="329" y="650" width="189" height="22" rx="11" fill="#f8f9f9" stroke="#b08a4a"/><text x="423.5" y="665" class="tag" text-anchor="middle" fill="#b08a4a" style="fill:#b08a4a">robot not connected</text><text x="46" y="696" class="b" text-anchor="start">torso yaw, shoulder/elbow × 2, head yaw/pitch/roll</text><text x="46" y="718" class="b" text-anchor="start">schematic coordinates matching Sota&#x27;s 8 DoF</text><text x="46" y="740" class="b" text-anchor="start">not servo commands: SDK / joint conversion not connected</text><rect x="590" y="640" width="500" height="150" rx="8" fill="#f1e8d6" stroke="#b08a4a" stroke-width="1.5"/><text x="606" y="668" class="h" text-anchor="start">Synchronized browser playback</text><text x="606" y="696" class="b" text-anchor="start">plays the original reply speech</text><text x="606" y="718" class="b" text-anchor="start">frame = floor(audio.currentTime × 30)</text><text x="606" y="740" class="b" text-anchor="start">the audio clock selects the motion frame</text><polyline points="790,520 790,600 280,600 280,638" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="300" y="594" class="s" text-anchor="start">joint rotations</text><polyline points="530,715 588,715" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="559" y="700" class="s" text-anchor="middle">coordinates</text><polyline points="510,160 510,190 1105,190 1105,612 840,612 840,638" fill="none" stroke="#4a5a63" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="848" y="632" class="s" text-anchor="start">reply speech (original WAV)</text><rect x="30" y="817" width="22" height="16" rx="3" fill="#e3eaef" stroke="#7d95a6"/><text x="60" y="830" class="cap" text-anchor="start">frozen (not updated)</text><rect x="330" y="817" width="22" height="16" rx="3" fill="#dcecdf" stroke="#5e8c6b"/><text x="360" y="830" class="cap" text-anchor="start">trained here</text><rect x="630" y="817" width="22" height="16" rx="3" fill="#f1e8d6" stroke="#b08a4a"/><text x="660" y="830" class="cap" text-anchor="start">playback / mapping (robot not connected)</text><text x="30" y="870" class="cap" text-anchor="start">Generation is a cascade (completed speech → features → body motion); only playback is synchronized. No simultaneous generation and no joint training of the two models.</text></svg>