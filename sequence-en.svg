<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Two-model cascade through generated reply audio</title><desc id="desc">Qwen completes audio, then audio features condition body generation. Synchronized playback follows both generation stages.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4c6559" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK JP",Meiryo,sans-serif;fill:#213c34}.label{font-size:19px;font-weight:700}.small{font-size:15px}.heading{font-size:24px;font-weight:700}.tiny{font-size:13px}</style><rect width="1120" height="640" fill="#f8f8f2"/><text x="25" y="38" class="heading">Execution: sequential generation, synchronized playback</text><text x="25" y="69" class="small">Schematic only; horizontal widths are not proportional to measured time.</text><text x="25" y="160" class="label">Qwen</text><line x1="200" y1="210" x2="1080" y2="210" stroke="#d4ddd0"/><text x="25" y="275" class="label">Audio features</text><line x1="200" y1="325" x2="1080" y2="325" stroke="#d4ddd0"/><text x="25" y="385" class="label">Body model</text><line x1="200" y1="435" x2="1080" y2="435" stroke="#d4ddd0"/><text x="25" y="510" class="label">Browser</text><line x1="200" y1="560" x2="1080" y2="560" stroke="#d4ddd0"/><rect x="205" y="115" width="255" height="85" rx="8" fill="#e7eef1" stroke="#779180"/><text x="221" y="144" class="label">Generate text + speech</text><text x="221" y="171" class="small">Retain completed WAV</text><polyline points="460,160 492,160 492,255" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="235" width="200" height="85" rx="8" fill="#e7eef1" stroke="#779180"/><text x="508" y="264" class="label">Encode audio windows</text><text x="508" y="291" class="small">24 kHz → 16 kHz</text><polyline points="692,277 725,277 725,365" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><rect x="725" y="345" width="220" height="85" rx="8" fill="#dce9cf" stroke="#779180"/><text x="741" y="374" class="label">50-step sampling</text><text x="741" y="401" class="small">Complete all motion windows</text><polyline points="945,387 978,387 978,475" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="475" width="340" height="92" rx="8" fill="#eee9da" stroke="#779180"/><text x="751" y="504" class="label">Play original audio + motion</text><text x="751" y="531" class="small">i = min(F − 1, floor(30 × audioTime))</text><text x="25" y="602" class="small">Not implemented: body generation during Qwen speech synthesis, or jointly trained speech/body heads.</text></svg>