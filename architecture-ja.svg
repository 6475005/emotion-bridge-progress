<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc"><title id="title">応答音声を介した二モデルの直列接続</title><desc id="desc">Qwen生成完了後、音声を特徴量へ変換し、身体モデルを実行する。両方の生成完了後に同期再生する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4c6559" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK JP",Meiryo,sans-serif;fill:#213c34}.label{font-size:19px;font-weight:700}.small{font-size:15px}.heading{font-size:24px;font-weight:700}.tiny{font-size:13px}</style><rect width="1120" height="890" fill="#f8f8f2"/><text x="25" y="38" class="heading">モデルアーキテクチャ：凍結Qwen + 独立した身体生成モデル</text><text x="25" y="70" class="small">常駐ワーカー内の機能境界。緑は身体学習の対象、青はその段階で凍結したモデル。</text><rect x="25" y="110" width="260" height="125" rx="8" fill="#efefe5" stroke="#779180"/><text x="41" y="139" class="label">入力</text><text x="41" y="166" class="small">text + history + language</text><text x="41" y="189" class="small">検証済み入力：テキスト</text><text x="41" y="212" class="small">画像・音声の統合評価は今後</text><rect x="340" y="110" width="320" height="125" rx="8" fill="#e7eef1" stroke="#779180"/><text x="356" y="139" class="label">モデル1：Qwen3-Omni</text><text x="356" y="166" class="small">Thinker / Talker / audio output</text><text x="356" y="189" class="small">返答文 + 24 kHz PCM16 WAV</text><text x="356" y="212" class="small">Qwenの重みは更新しない</text><rect x="720" y="110" width="370" height="125" rx="8" fill="#e7eef1" stroke="#779180"/><text x="736" y="139" class="label">Qwenの既存 audio_tower を再利用</text><text x="736" y="166" class="small">完成WAV → 16 kHz → 4秒窓</text><text x="736" y="189" class="small">末尾はゼロ埋め／有効長を保持</text><text x="736" y="212" class="small">[N, 52, 2048] → float32</text><polyline points="285,168 340,168" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,168 720,168" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="669" y="153" class="tiny">完成音声</text><rect x="25" y="285" width="1065" height="320" rx="10" fill="#f0f5e9" stroke="#72905c" stroke-width="2"/><text x="45" y="318" class="label">モデル2：共有・条件付き身体拡散モデル（full-v5）</text><rect x="45" y="345" width="270" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="61" y="374" class="label">条件と状態</text><text x="61" y="401" class="small">audio: [N,52,2048]</text><text x="61" y="424" class="small">history: 直前30フレーム</text><text x="61" y="447" class="small">latent noise + timestep</text><rect x="355" y="345" width="365" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="371" y="374" class="label">共有Transformer系統</text><text x="371" y="401" class="small">width256 /12 blocks /8 heads</text><text x="371" y="424" class="small">自己注意 + 音声への交差注意</text><text x="371" y="447" class="small">骨格別の入力・出力投影</text><rect x="760" y="345" width="305" height="142" rx="8" fill="#dce9cf" stroke="#779180"/><text x="776" y="374" class="label">潜在速度 v を予測</text><text x="776" y="401" class="small">dynamics: [1,150,32]</text><text x="776" y="424" class="small">Trinityのみ pose: [1,150]</text><text x="776" y="447" class="small">固定50ステップで反復</text><polyline points="904,235 904,260 35,260 35,332 180,332 180,345" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="253" class="tiny">保存済み学習統計で正規化</text><polyline points="315,415 355,415" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,415 760,415" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="525" class="small">150スロット = 文脈30 + 現在120。文脈がない場合は該当潜在スロットをマスク。</text><text x="45" y="555" class="small">身体学習対象14,055,926パラメータ。Qwenを含む総数ではない。推論時は全モデル更新なし。</text><rect x="45" y="650" width="430" height="126" rx="8" fill="#e7eef1" stroke="#779180"/><text x="61" y="679" class="label">凍結した動作コーデック／復号</text><text x="61" y="706" class="small">日本語：120フレーム × 120D</text><text x="61" y="729" class="small">Trinity英語：120フレーム × 150D</text><text x="61" y="752" class="small">6D関節回転。有効フレームだけを連結。</text><rect x="640" y="650" width="425" height="126" rx="8" fill="#eee9da" stroke="#779180"/><text x="656" y="679" class="label">模式写像 → 音声時計で再生</text><text x="656" y="706" class="small">8個の模式座標 ≠ 実機サーボ指令</text><text x="656" y="729" class="small">frame = floor(audio.currentTime ×30)</text><text x="656" y="752" class="small">実機SDK・関節変換は未接続</text><polyline points="908,487 908,580 270,580 270,650" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="573" class="tiny">潜在を復号</text><polyline points="475,711 640,711" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="697" class="tiny">元音声も再利用</text><polyline points="100,650 100,625 10,625 10,505 65,505 65,487" fill="none" stroke="#4c6559" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="628" class="tiny">生成末尾30フレームを次窓へ</text><text x="25" y="827" class="small">身体モデルへの入力は応答音声特徴。Qwen Talkerの隠れ状態や返答テキストを直接入力する構成ではない。</text><text x="25" y="858" class="small">同じ常駐ワーカーに置くことと、二つのモデルを共同学習することは異なる。</text></svg>