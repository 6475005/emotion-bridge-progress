<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-labelledby="t d"><title id="t">凍結したQwen3-Omniと学習した身体動作生成モデルの直列接続</title><desc id="d">Qwenが応答文と応答音声を生成し、その音声をQwen内蔵の音声エンコーダーで特徴量に変換し、学習した身体拡散モデルが30 Hzの関節回転列を生成する。復号後に模式表示で音声と同期再生する。実機は未接続。</desc><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4a5a63"/></marker></defs><style>text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,Arial,sans-serif;fill:#1a2228}.h{font-size:19px;font-weight:700}.b{font-size:14.5px}.s{font-size:13px;fill:#3f4c55}.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em}.cap{font-size:13px;fill:#6b7982}.mono{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:13px}</style><rect width="1120" height="900" fill="#f8f9f9"/><rect x="30" y="30" width="250" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="46" y="58" class="h" text-anchor="start">入力</text><text x="46" y="86" class="b" text-anchor="start">テキスト + 対話履歴 + 言語</text><text x="46" y="108" class="b" text-anchor="start">検証済み：テキスト入力</text><text x="46" y="130" class="b" text-anchor="start">マイク・カメラ入力は次段階</text><rect x="320" y="30" width="380" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="336" y="58" class="h" text-anchor="start">モデル1：Qwen3-Omni</text><rect x="652" y="40" width="36" height="22" rx="11" fill="#f8f9f9" stroke="#7d95a6"/><text x="670.0" y="55" class="tag" text-anchor="middle" fill="#7d95a6" style="fill:#7d95a6">凍結</text><text x="336" y="86" class="b" text-anchor="start">Thinker / Talker / 音声コーデック</text><text x="336" y="108" class="b" text-anchor="start">出力：応答文 + 24 kHz 音声（WAV）</text><text x="336" y="130" class="b" text-anchor="start">重みは更新しない</text><rect x="740" y="30" width="350" height="130" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="756" y="58" class="h" text-anchor="start">Qwen内蔵の音声エンコーダーを再利用</text><text x="756" y="86" class="mono" text-anchor="start">完成した音声 → 16 kHz → 4秒区間</text><text x="756" y="108" class="mono" text-anchor="start">[N, 52, 2048] float32</text><text x="756" y="130" class="b" text-anchor="start">GPU上で二重に載せない</text><polyline points="280,95 318,95" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><polyline points="700,95 738,95" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="703" y="80" class="s" text-anchor="start">応答音声</text><rect x="30" y="215" width="1060" height="330" rx="10" fill="none" stroke="#5e8c6b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="50" y="245" class="h" text-anchor="start">モデル2：音声条件付き身体拡散モデル（内部名 full-v5、学習更新16,000回）</text><text x="50" y="268" class="s" text-anchor="start">身体学習の対象 14,055,926 パラメータ（Qwenを含まない）。推論時はどのモデルも更新しない。</text><rect x="50" y="290" width="320" height="230" rx="8" fill="#dcecdf" stroke="#5e8c6b" stroke-width="1.5"/><text x="66" y="318" class="h" text-anchor="start">条件と状態</text><text x="66" y="346" class="b" text-anchor="start">音声特徴 [N,52,2048] → 32 → 256</text><text x="66" y="368" class="b" text-anchor="start">直前の生成 30 フレーム（履歴）</text><text x="66" y="390" class="b" text-anchor="start">潜在ノイズ + 拡散時刻</text><text x="66" y="412" class="b" text-anchor="start">トークン 180 = 履歴30 + 文脈30 + 現在120</text><text x="66" y="434" class="b" text-anchor="start">保存済み学習統計で正規化</text><rect x="400" y="290" width="320" height="230" rx="8" fill="#dcecdf" stroke="#5e8c6b" stroke-width="1.5"/><text x="416" y="318" class="h" text-anchor="start">共有Transformer</text><rect x="672" y="300" width="36" height="22" rx="11" fill="#f8f9f9" stroke="#5e8c6b"/><text x="690.0" y="315" class="tag" text-anchor="middle" fill="#5e8c6b" style="fill:#5e8c6b">学習</text><text x="416" y="346" class="b" text-anchor="start">幅 256 / 12 ブロック / 8 ヘッド</text><text x="416" y="368" class="b" text-anchor="start">自己注意 + 音声への交差注意</text><text x="416" y="390" class="b" text-anchor="start">言語（骨格）別の入力・出力層</text><text x="416" y="412" class="b" text-anchor="start">潜在速度 v を予測</text><text x="416" y="434" class="b" text-anchor="start">決定的サンプリング 50 ステップ</text><rect x="750" y="290" width="320" height="230" rx="8" fill="#e3eaef" stroke="#7d95a6" stroke-width="1.5"/><text x="766" y="318" class="h" text-anchor="start">凍結した動作コーデック（復号）</text><text x="766" y="346" class="b" text-anchor="start">日本語：120 フレーム × 120 次元</text><text x="766" y="368" class="b" text-anchor="start">英語（Trinity）：120 × 150 次元</text><text x="766" y="390" class="b" text-anchor="start">20 / 25 関節 × 6D 回転</text><text x="766" y="412" class="b" text-anchor="start">有効フレームだけを連結</text><text x="766" y="434" class="b" text-anchor="start">30 Hz の関節回転列</text><polyline points="370,405 398,405" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><polyline points="720,405 748,405" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="734" y="388" class="s" text-anchor="middle">復号</text><polyline points="915,160 915,213" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="925" y="195" class="s" text-anchor="start">特徴量</text><polyline points="1030,520 1030,560 210,560 210,522" fill="none" stroke="#4a5a63" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="500" y="548" class="s" text-anchor="middle">生成末尾 30 フレームを次の 4 秒区間の履歴へ（応答をまたぐ履歴はリセット）</text><rect x="30" y="640" width="500" height="150" rx="8" fill="#f1e8d6" stroke="#b08a4a" stroke-width="1.5"/><text x="46" y="668" class="h" text-anchor="start">模式写像（8 座標）</text><rect x="455" y="650" width="63" height="22" rx="11" fill="#f8f9f9" stroke="#b08a4a"/><text x="486.5" y="665" class="tag" text-anchor="middle" fill="#b08a4a" style="fill:#b08a4a">実機未接続</text><text x="46" y="696" class="b" text-anchor="start">胴ヨー、肩・肘 × 2、頭ヨー・ピッチ・ロール</text><text x="46" y="718" class="b" text-anchor="start">Sota の 8 自由度に対応する模式座標</text><text x="46" y="740" class="b" text-anchor="start">サーボ指令ではない：SDK・関節変換は未接続</text><rect x="590" y="640" width="500" height="150" rx="8" fill="#f1e8d6" stroke="#b08a4a" stroke-width="1.5"/><text x="606" y="668" class="h" text-anchor="start">ブラウザーで同期再生</text><text x="606" y="696" class="b" text-anchor="start">元の応答音声をそのまま再生</text><text x="606" y="718" class="b" text-anchor="start">frame = floor(audio.currentTime × 30)</text><text x="606" y="740" class="b" text-anchor="start">音声の再生時刻が動作フレームを選ぶ</text><polyline points="790,520 790,600 280,600 280,638" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="300" y="594" class="s" text-anchor="start">関節回転列</text><polyline points="530,715 588,715" fill="none" stroke="#4a5a63" stroke-width="2" marker-end="url(#ah)"/><text x="559" y="700" class="s" text-anchor="middle">座標列</text><polyline points="510,160 510,190 1105,190 1105,612 840,612 840,638" fill="none" stroke="#4a5a63" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="848" y="632" class="s" text-anchor="start">応答音声（元のWAV）</text><rect x="30" y="817" width="22" height="16" rx="3" fill="#e3eaef" stroke="#7d95a6"/><text x="60" y="830" class="cap" text-anchor="start">凍結（更新しない）</text><rect x="330" y="817" width="22" height="16" rx="3" fill="#dcecdf" stroke="#5e8c6b"/><text x="360" y="830" class="cap" text-anchor="start">学習対象</text><rect x="630" y="817" width="22" height="16" rx="3" fill="#f1e8d6" stroke="#b08a4a"/><text x="660" y="830" class="cap" text-anchor="start">再生・写像（実機未接続）</text><text x="30" y="870" class="cap" text-anchor="start">生成は「応答音声の完成 → 特徴量 → 身体動作」の順に直列に行い、再生だけを同期する。音声と動作の同時生成や両モデルの共同学習は行っていない。</text></svg>